id = "sapphire-agent"
name = "Linear epics"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Dispatch Linear epics in Ready For Agent to Claude Code runs and keep Linear in sync."
platforms = ["linux"]

# The dispatcher is a systemd user service; this only makes sure it is up.
[[startup]]
command = ["sh", "scripts/ensure-running.sh"]

[[actions]]
id = "pause"
title = "Pause Linear dispatching"
description = "Stop picking up new epics. Runs in flight keep being watched."
contexts = ["global"]
command = ["sh", "scripts/ctl.sh", "pause"]

[[actions]]
id = "resume"
title = "Resume Linear dispatching"
contexts = ["global"]
command = ["sh", "scripts/ctl.sh", "resume"]

[[actions]]
id = "status"
title = "Linear dispatcher status"
contexts = ["global"]
command = ["sh", "scripts/ctl.sh", "status"]
